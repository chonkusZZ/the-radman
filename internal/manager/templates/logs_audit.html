{{define "content"}}<h1>Logs</h1>{{template "logtabs" .}}
<div class="card"><table><tr><th>Time</th><th>Actor</th><th>Action</th><th>Detail</th></tr>{{range .Rows}}<tr><td class="nowrap">{{fmtTime .Time}}</td><td>{{.Actor}}</td><td><code>{{.Action}}</code></td><td>{{.Detail}}</td></tr>{{end}}</table></div>{{end}}
{{define "logtabs"}}<div class="tabs"><a href="/logs" class="{{if eq .Tab "auth"}}on{{end}}">Authentication</a><a href="/logs/acct" class="{{if eq .Tab "acct"}}on{{end}}">Accounting</a><a href="/logs/audit" class="{{if eq .Tab "audit"}}on{{end}}">Audit</a></div>{{end}}
